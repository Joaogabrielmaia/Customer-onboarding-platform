name: Recarregar dados de exemplo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  reseed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
      SEED_CONFIRM_RESET: "yes"
    steps:
      - name: Verificar se o banco está configurado
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Segredo SEED_DATABASE_URL ausente: nada a fazer."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 24
          cache: npm
      - if: env.SKIP != '1'
        run: npm ci
      - if: env.SKIP != '1'
        run: npm run db:seed
