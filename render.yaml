# Blueprint da Render: cria o banco PostgreSQL e o serviço web a partir deste repositório.
databases:
  - name: trilha-db
    plan: free
    databaseName: trilha
    user: trilha

services:
  - type: web
    name: trilha
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: trilha-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # Primeiro acesso: o app cria este administrador quando o banco está sem usuários.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # "true" carrega os dados de exemplo (clientes, modelos e implantações) no primeiro start.
      - key: SEED_EXAMPLE_DATA
        value: "true"
